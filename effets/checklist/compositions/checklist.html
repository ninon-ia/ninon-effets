  <script>
    (function () {
      // Durée et textes : lus sur la racine de la scène (son hôte, qui porte data-duration et data-variable-values).
      const racine =
        document.querySelector('[data-composition-id="checklist"][data-duration]') ||
        document.querySelector("[data-composition-id][data-duration]");
      const DUREE = parseFloat(racine.dataset.duration);
      let V = {};
      try {
        V = JSON.parse(racine.getAttribute("data-variable-values") || "{}");
      } catch (e) {
        V = {};
      }
      const hf = window.__hyperframes;
      if (!Object.keys(V).length && hf && hf.getVariables) V = hf.getVariables();
      const texte = (id, el) => String(V[id] !== undefined ? V[id] : el.textContent).trim();

      // Étapes actives : libellé non vide (2 à 5). Les autres lignes et leurs segments disparaissent.
      const actives = [];
      for (let i = 1; i <= 5; i++) {
        if (texte("etape" + i, document.getElementById("ck-lib" + i))) actives.push(i);
        else {
          document.getElementById("ck-l" + i).style.display = "none";
          document.getElementById("ck-segw" + i).style.display = "none";
        }
      }
      if (!actives.length) actives.push(1);
      const N = actives.length;
      document.getElementById("ck-l" + actives[0]).style.borderTop = "none";
      document.getElementById("ck-sur").textContent = "/" + N;
      if (!texte("commande", document.getElementById("ck-slash"))) {
        document.getElementById("ck-slash").style.display = "none";
        document.getElementById("ck-point").style.display = "none";
      }

      // Coches réparties sur les premiers 75 % de DUREE.
      const PREMIERE = 0.15;
      const DERNIERE = 0.75 * DUREE - 0.125;
      const PAS = N > 1 ? (DERNIERE - PREMIERE) / (N - 1) : 0;
      const TICKS = actives.map((_, k) => PREMIERE + k * PAS);
      const FIN = TICKS[N - 1] + 0.15;
      const lignes = actives.map((i) => "#ck-l" + i);
      const i0 = actives[0];

      const tl = gsap.timeline({ paused: true });

      // Entrée : le panneau monte et se pose, les lignes suivent en cascade.
      tl.fromTo("#ck-panneau", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" }, 0);
      tl.fromTo(lignes, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", stagger: 0.035 }, 0.04);
      tl.fromTo(".ck-seg i", { scaleX: 0 }, { scaleX: 0, duration: 0.01 }, 0);
      tl.fromTo("#ck-chiffres", { y: 0 }, { y: 0, duration: 0.01 }, 0);

      // La première étape est « en cours » dès l'entrée.
      tl.fromTo("#ck-lib" + i0, { opacity: 0.45 }, { opacity: 0.82, duration: 0.12, ease: "power2.out" }, 0);
      tl.fromTo("#ck-rond" + i0, { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, 0.01);

      // L'arc tourne à vitesse constante (600°/s) tant qu'une étape est en cours.
      tl.fromTo(".ck-rond circle", { rotation: 0 }, { rotation: 600 * DUREE, duration: DUREE, ease: "none", svgOrigin: "21 21" }, 0);

      TICKS.forEach((t, k) => {
        const i = actives[k];
        tl.to("#ck-rond" + i, { opacity: 0, duration: 0.06, ease: "none" }, t);
        tl.fromTo("#ck-plein" + i, { opacity: 0, scale: 0.55 }, { opacity: 1, scale: 1, duration: 0.24, ease: "expo.out" }, t);
        tl.fromTo("#ck-coche" + i, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.2, ease: "power2.out" }, t + 0.05);
        tl.to("#ck-lib" + i, { opacity: 1, duration: 0.18, ease: "power2.out" }, t);
        tl.fromTo(
          "#ck-det" + i,
          { opacity: 0.6, color: "#a3a2a8" },
          { opacity: 1, color: "#f0a37c", duration: 0.22, ease: "power2.out" },
          t + 0.04,
        );
        tl.to("#ck-seg" + i, { scaleX: 1, duration: 0.3, ease: "power3.out" }, t);
        if (k > 0) tl.to("#ck-chiffres", { y: -k * 56, duration: 0.26, ease: "power3.out" }, t);
        if (k < N - 1) {
          const suivante = actives[k + 1];
          tl.to("#ck-lib" + suivante, { opacity: 0.82, duration: 0.16, ease: "power2.out" }, t + 0.08);
          tl.to("#ck-rond" + suivante, { opacity: 1, duration: 0.06, ease: "none" }, t + 0.08);
        }
      });

      // Fin : l'état bascule, le bord du panneau prend l'accent.
      tl.to("#ck-cours", { opacity: 0, filter: "blur(4px)", duration: 0.14, ease: "power2.in" }, FIN);
      tl.fromTo("#ck-fini", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, FIN + 0.08);
      tl.to("#ck-panneau", { borderColor: "rgba(194,65,12,0.8)", duration: 0.4, ease: "power2.inOut" }, FIN);
      tl.set({}, {}, DUREE);

      window.__timelines["checklist"] = tl;
    })();
  </script>
