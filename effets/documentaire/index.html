  <body>

    <script>
      (function () {
        const DUREE = parseFloat(document.querySelector("[data-composition-id]").dataset.duration);
        const tl = gsap.timeline({ paused: true });
        const CIRC = 2 * Math.PI * 420;

        // --- Textes (variables) : étiquette avec « · » orange, ligne orange du titre
        const hf = window.__hyperframes;
        const V = (hf && hf.getVariables && hf.getVariables()) || {};
        if (typeof V.etiquette === "string") {
          const el = document.getElementById("etiquette-texte");
          el.textContent = "";
          V.etiquette.split("·").forEach((morceau, i) => {
            if (i > 0) {
              const b = document.createElement("b");
              b.textContent = "·";
              el.appendChild(b);
            }
            el.appendChild(document.createTextNode(morceau));
          });
        }
        const orange = Math.min(3, Math.max(1, Math.round(Number(V.ligne_orange) || 2)));
        [1, 2, 3].forEach((n) => document.getElementById("ligne-" + n).classList.toggle("orange", n === orange));

        // --- Ajustement des tailles : chaque bloc garde sa taille de démo et rétrécit seulement si le texte
        // dépasse sa largeur utile (titre ≤ 580 px pour ne pas couvrir le visage). Mesuré à chaque image :
        // déterministe, et juste dès que les polices sont chargées.
        const AJUSTS = [
          { el: document.getElementById("titre"), base: 142, max: 580, mesure: () => document.getElementById("titre").scrollWidth - 34 },
          { el: document.getElementById("etiquette"), base: 28, max: 900 },
          { el: document.getElementById("signature"), base: 56, max: 520 },
          { el: document.getElementById("bandeau-nom"), base: 104, max: 520 },
          { el: document.getElementById("pseudo"), base: 40, max: 560 },
          { el: document.getElementById("suivre-texte"), base: 40, max: 270 },
          { el: document.getElementById("abonnee-texte"), base: 40, max: 226 },
        ];
        function ajuster() {
          for (const a of AJUSTS) {
            a.el.style.fontSize = a.base + "px";
            const w = a.mesure ? a.mesure() : a.el.scrollWidth;
            if (w > a.max) a.el.style.fontSize = Math.floor((a.base * a.max) / w) + "px";
          }
        }
        ajuster();
        if (document.fonts) document.fonts.ready.then(ajuster);
        const horloge = { t: 0 };
        tl.fromTo(horloge, { t: 0 }, { t: 1, duration: DUREE, ease: "none", immediateRender: true, onUpdate: ajuster }, 0);

        // --- Mouvement continu (0 → DUREE)
        tl.fromTo("#poster", { scale: 1 }, { scale: 1.03, duration: DUREE, ease: "none" }, 0);
        tl.fromTo("#sujet", { x: 0, y: 0 }, { x: -14, y: -6, duration: DUREE, ease: "none" }, 0);
        tl.fromTo("#lueur", { opacity: 0.7, scale: 0.96 }, { opacity: 1, scale: 1.06, duration: DUREE, ease: "sine.inOut" }, 0);
        tl.fromTo("#anneau-fin", { rotation: 0, svgOrigin: "330 500" }, { rotation: -24, svgOrigin: "330 500", duration: DUREE, ease: "none" }, 0);

        // --- Anneau + disque (0,05 → 0,4 s), puis la tête de tracé continue lentement jusqu'à DUREE
        tl.fromTo("#anneau", { strokeDasharray: CIRC, strokeDashoffset: CIRC }, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 0.05);
        tl.fromTo("#tete-anneau", { rotation: 0, svgOrigin: "330 500", opacity: 1 }, { rotation: 360, svgOrigin: "330 500", duration: 0.35, ease: "power2.out" }, 0.05);
        tl.to("#tete-anneau", { rotation: 412, svgOrigin: "330 500", duration: DUREE - 0.4, ease: "none" }, 0.4);
        tl.fromTo("#disque", { opacity: 0, scale: 0.82 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, 0.05);

        // --- Étiquette
        tl.fromTo("#etiquette", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.24, ease: "power2.out" }, 0.08);
        tl.fromTo("#etiquette-trait", { scaleX: 0, transformOrigin: "100% 50%" }, { scaleX: 1, duration: 0.26, ease: "power3.out" }, 0.12);

        // --- Titre, ligne par ligne (0,1 → 0,45 s)
        tl.fromTo("#ligne-1", { yPercent: 135 }, { yPercent: 0, duration: 0.15, ease: "power3.out" }, 0.1);
        tl.fromTo("#ligne-2", { yPercent: 135 }, { yPercent: 0, duration: 0.15, ease: "power3.out" }, 0.2);
        tl.fromTo("#ligne-3", { yPercent: 135 }, { yPercent: 0, duration: 0.15, ease: "power3.out" }, 0.3);
        tl.fromTo("#titre", { x: 0 }, { x: -10, duration: DUREE - 0.4, ease: "none" }, 0.4);
        tl.fromTo("#signature", { opacity: 0, y: 14, rotation: -5 }, { opacity: 1, y: 0, rotation: -5, duration: 0.3, ease: "power2.out" }, 0.48);

        // --- Bandeau nom + pseudo
        tl.fromTo("#bandeau-fond", { scaleX: 0 }, { scaleX: 1, duration: 0.2, ease: "power3.out" }, 0.16);
        tl.fromTo("#bandeau-nom", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.18, ease: "power3.out" }, 0.22);
        tl.fromTo("#pseudo", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.2, ease: "power2.out" }, 0.28);

        // --- Bouton
        tl.fromTo("#bouton", { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(1.6)" }, 0.24);

        // --- Curseur : glisse, clique à 0,95 s, repart et disparaît vers 2,15 s
        tl.fromTo("#curseur", { opacity: 0, x: 170, y: 300 }, { opacity: 1, x: 0, y: 0, duration: 0.42, ease: "power2.inOut" }, 0.46);
        tl.to("#curseur", { scale: 0.82, transformOrigin: "5px 4px", duration: 0.05, ease: "power2.in" }, 0.9);
        tl.to("#curseur", { scale: 1, transformOrigin: "5px 4px", duration: 0.1, ease: "power2.out" }, 0.96);
        tl.to("#bouton", { scale: 0.95, duration: 0.05, ease: "power2.in" }, 0.9);
        tl.to("#bouton", { scale: 1, duration: 0.22, ease: "back.out(2.2)" }, 0.96);
        tl.to("#bouton-corps", { backgroundColor: "#3a3330", boxShadow: "0 14px 40px rgba(0, 0, 0, 0.35)", duration: 0.12, ease: "power1.out" }, 0.95);
        tl.to("#etat-suivre", { opacity: 0, y: -18, duration: 0.06, ease: "power2.in" }, 0.95);
        tl.fromTo("#etat-abonnee", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.14, ease: "power2.out" }, 1.0);
        tl.fromTo("#onde", { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 4.2, duration: 0.42, ease: "power2.out" }, 0.95);
        tl.to("#curseur", { x: 60, y: 70, duration: 0.9, ease: "sine.inOut" }, 1.2);
        tl.to("#curseur", { opacity: 0, duration: 0.3, ease: "power1.in" }, 1.85);

        // --- Grain : image fixe déplacée à 15 i/s jusqu'à DUREE (positions pseudo-aléatoires à graine fixe)
        let s = 20261026;
        const rnd = () => ((s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296);
        for (let i = 0; i <= Math.ceil(DUREE * 15); i++) {
          tl.set("#grain", { x: Math.round(rnd() * 180 - 90), y: Math.round(rnd() * 300 - 150) }, i / 15);
        }

        tl.set({}, {}, DUREE);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
