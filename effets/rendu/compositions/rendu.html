  <script>
    (function () {
      const NS = "http://www.w3.org/2000/svg";
      // Graduations de la règle (statiques).
      const reg = document.getElementById("rd-graduations");
      for (let i = 0; i <= 52; i++) {
        const x = 1 + i * (716 / 52);
        const grand = i % 4 === 0;
        const r = document.createElementNS(NS, "rect");
        r.setAttribute("x", x.toFixed(2));
        r.setAttribute("y", grand ? "6" : "16");
        r.setAttribute("width", "2");
        r.setAttribute("height", grand ? "24" : "14");
        r.setAttribute("fill", grand ? "#6a696f" : "#48474c");
        reg.appendChild(r);
      }
      // Forme d'onde déterministe (aucun hasard).
      const onde = document.getElementById("rd-onde");
      const N = 118;
      for (let i = 0; i < N; i++) {
        const env = 0.55 + 0.45 * Math.sin(i * 0.09 + 0.6);
        const v = Math.abs(Math.sin(i * 1.71) * 0.6 + Math.sin(i * 0.43 + 1.2) * 0.4);
        const h = Math.max(6, 50 * env * (0.25 + 0.75 * v));
        const r = document.createElementNS(NS, "rect");
        r.setAttribute("x", (4 + i * 6).toFixed(1));
        r.setAttribute("y", (32 - h / 2).toFixed(1));
        r.setAttribute("width", "3.2");
        r.setAttribute("height", h.toFixed(1));
        r.setAttribute("rx", "1.6");
        onde.appendChild(r);
      }

      // Durée et textes : lus sur la racine de la scène (son hôte, qui porte data-duration et data-variable-values).
      const racine =
        document.querySelector('[data-composition-id="rendu"][data-duration]') ||
        document.querySelector("[data-composition-id][data-duration]");
      const DUREE = parseFloat(racine.dataset.duration);
      let V = {};
      try {
        V = JSON.parse(racine.getAttribute("data-variable-values") || "{}");
      } catch (e) {
        V = {};
      }
      const hf = window.__hyperframes;
      if (!Object.keys(V).length && hf && hf.getVariables) V = hf.getVariables();
      const nombreVar = (id, defaut) => {
        const n = Number(V[id]);
        return Number.isFinite(n) ? n : defaut;
      };

      const tl = gsap.timeline({ paused: true });
      const P0 = Math.min(0.95, Math.max(0, nombreVar("depart", 41) / 100));
      const T0 = 0.2;
      const T1 = DUREE - 0.2;
      const VOIE = 718;
      const IMAGES = Math.max(1, Math.round(nombreVar("images", 795))); // 26,5 s × 30 i/s par défaut

      // Entrée : la fenêtre se pose, les pistes et leurs blocs arrivent en cascade, puis la progression.
      tl.fromTo("#rd-fenetre", { opacity: 0.35, y: 34 }, { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" }, 0);
      tl.fromTo(".rd-piste", { opacity: 0.3, x: -14 }, { opacity: 1, x: 0, duration: 0.28, ease: "power3.out", stagger: 0.04 }, 0.04);
      tl.fromTo(".rd-bloc", { scaleX: 0.4, opacity: 0.3 }, { scaleX: 1, opacity: 1, duration: 0.3, ease: "expo.out", stagger: 0.012 }, 0.06);
      tl.fromTo("#rd-progres", { opacity: 0.3, y: 24 }, { opacity: 1, y: 0, duration: 0.32, ease: "power3.out" }, 0.04);

      // Progression 41 % → 100 % à vitesse constante ; tête de lecture, zone grisée et barre la suivent.
      tl.fromTo("#rd-tete", { x: VOIE * P0 }, { x: VOIE - 1, duration: T1 - T0, ease: "none" }, T0);
      tl.fromTo("#rd-reste", { scaleX: 1 - P0 }, { scaleX: 0, duration: T1 - T0, ease: "none" }, T0);
      tl.fromTo("#rd-rempli", { scaleX: P0 }, { scaleX: 1, duration: T1 - T0, ease: "none" }, T0);

      const nombre = document.getElementById("rd-nombre");
      const images = document.getElementById("rd-images");
      const tc = document.getElementById("rd-tc");
      const etat = { p: P0 };
      const ecrire = () => {
        const p = etat.p;
        nombre.textContent = String(Math.round(p * 100));
        const img = Math.round(p * IMAGES);
        images.textContent = "image " + String(img).padStart(4, "0") + "/" + IMAGES;
        const s = (p * IMAGES) / 30;
        const ss = Math.floor(s);
        const ff = Math.floor((s - ss) * 30);
        tc.textContent =
          String(Math.floor(ss / 60)).padStart(2, "0") + ":" + String(ss % 60).padStart(2, "0") + "." + String(ff).padStart(2, "0");
      };
      ecrire();
      tl.fromTo(etat, { p: P0 }, { p: 1, duration: T1 - T0, ease: "none", onUpdate: ecrire }, T0);

      // 100 % : le chiffre passe à l'accent, « prêt ✓ » remplace le compteur d'images, un reflet traverse la barre.
      tl.to("#rd-nombre", { color: "#f0a37c", duration: 0.2, ease: "power2.out" }, T1);
      tl.to("#rd-images", { opacity: 0, filter: "blur(4px)", duration: 0.12, ease: "power2.in" }, T1);
      tl.fromTo(
        "#rd-pret",
        { opacity: 0, scale: 0.9, filter: "blur(6px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.18, ease: "expo.out" },
        T1 + 0.03,
      );
      tl.fromTo("#rd-reflet", { x: -160, opacity: 0 }, { x: 960, opacity: 1, duration: 0.19, ease: "power2.in" }, T1 + 0.01);
      tl.to("#rd-tete .poignee", { backgroundColor: "#f0a37c", duration: 0.15, ease: "power2.out" }, T1);
      tl.set({}, {}, DUREE);

      window.__timelines["rendu"] = tl;
    })();
  </script>
