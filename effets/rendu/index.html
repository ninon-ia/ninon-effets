<!doctype html>
<!--
  Effet « rendu » (bibliothèque effets/, d'après E7 du reel démo studio, 26/10/2026)
  1080×1920, 30 i/s, durée DUREE (défaut 2,5 s, réécrite par outils/rendre-effet.sh), muet.
  En haut, la scène compositions/rendu.html : fenêtre « ninon.ia — rendu » (4 pistes, vignettes
  assets/media/vignette0…2.jpg, tête de lecture) et barre de rendu depart % → 100 % de 0,2 s à DUREE − 0,2 s,
  puis « prêt ✓ ». En bas, le clip (assets/media/clip.mp4) dans une carte arrondie qui se fond au noir.
  Tous les textes sont des variables déclarées ici ; le script relaie leurs valeurs à l'hôte de la scène
  (data-variable-values) avant son montage.
-->
<html
  lang="fr"
  data-resolution="portrait"
  data-composition-variables='[{"id": "marque", "type": "string", "label": "Fenêtre : marque", "default": "ninon.ia"}, {"id": "titre", "type": "string", "label": "Fenêtre : titre après la marque", "default": "— rendu"}, {"id": "piste1", "type": "string", "label": "Piste 1", "default": "vidéo"}, {"id": "piste2", "type": "string", "label": "Piste 2", "default": "briques"}, {"id": "piste3", "type": "string", "label": "Piste 3", "default": "titres"}, {"id": "piste4", "type": "string", "label": "Piste 4", "default": "musique"}, {"id": "quoi", "type": "string", "label": "Libellé de la barre", "default": "Rendu"}, {"id": "fichier", "type": "string", "label": "Nom du fichier rendu", "default": "final.mp4"}, {"id": "format", "type": "string", "label": "Ligne de specs", "default": "1080×1920 · 30 i/s"}, {"id": "depart", "type": "number", "label": "Pourcentage de départ", "default": 41, "min": 0, "max": 95, "step": 1, "unit": "%"}, {"id": "images", "type": "number", "label": "Nombre total d’images (compteur et timecode)", "default": 795, "min": 30, "max": 99999, "step": 1}, {"id": "pret", "type": "string", "label": "Mot final à 100 %", "default": "prêt ✓"}, {"id": "apercu", "type": "string", "label": "Pastille sur le clip", "default": "● aperçu 9:16"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #fond {
        position: absolute;
        inset: 0;
        z-index: 1;
        background:
          radial-gradient(ellipse 85% 40% at 50% 26%, #2a292d 0%, rgba(33, 32, 35, 0) 70%),
          linear-gradient(180deg, #212023 0%, #212023 50%, #0c0b0d 78%, #000 92%);
      }
      #visage {
        position: absolute;
        left: 70px;
        top: 1000px;
        width: 940px;
        height: 640px;
        object-fit: cover;
        object-position: 50% 21%;
        border-radius: 32px;
        z-index: 2;
      }
      /* Fondu au noir au bas de la carte, et bord fin de la charte. */
      #fondu {
        position: absolute;
        left: 70px;
        top: 1000px;
        width: 940px;
        height: 640px;
        border-radius: 32px;
        z-index: 3;
        box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.1);
        background: linear-gradient(180deg, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0) 72%, rgba(0, 0, 0, 0.75) 90%, #000 100%);
      }
      #apercu {
        position: absolute;
        left: 98px;
        top: 1028px;
        height: 50px;
        padding: 0 20px 0 18px;
        border-radius: 25px;
        z-index: 4;
        background: rgba(20, 19, 21, 0.78);
        font-family: "JetBrains Mono", monospace;
        font-size: 28px;
        font-weight: 600;
        line-height: 50px;
        color: #f0a37c;
        white-space: nowrap;
      }
      #rendu {
        z-index: 5;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2.5" data-width="1080" data-height="1920">
      <div id="fond" class="clip" data-start="0" data-duration="2.5" data-track-index="0"></div>
      <video
        id="visage"
        class="clip"
        src="assets/media/clip.mp4"
        data-start="0"
        data-duration="2.5"
        data-track-index="1"
        muted
        playsinline
      ></video>
      <div id="fondu" class="clip" data-start="0" data-duration="2.5" data-track-index="2"></div>
      <div id="apercu" class="clip" data-start="0" data-duration="2.5" data-track-index="3" data-var-text="apercu">● aperçu 9:16</div>
      <div
        id="rendu"
        class="clip"
        data-composition-id="rendu"
        data-composition-src="compositions/rendu.html"
        data-start="0"
        data-duration="2.5"
        data-track-index="4"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
    </div>
    <script>
      (function () {
        const racine = document.querySelector("[data-composition-id]");
        const DUREE = parseFloat(racine.dataset.duration);
        // Les textes vivent ici : on les relaie à la scène rendu avant qu'elle soit montée.
        const hf = window.__hyperframes;
        const vars = (hf && hf.getVariables && hf.getVariables()) || {};
        document.getElementById("rendu").setAttribute("data-variable-values", JSON.stringify(vars));
        if (!String(vars.apercu ?? "x").trim()) document.getElementById("apercu").style.visibility = "hidden";
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#apercu", { opacity: 0 }, { opacity: 1, duration: 0.22, ease: "power2.out" }, 0.12);
        tl.set({}, {}, DUREE);
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
